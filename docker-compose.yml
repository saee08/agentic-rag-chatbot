# Local production-like stack: PostgreSQL + pgvector and the app.
#   cp .env.example .env   # then set OPENROUTER_API_KEY and POSTGRES_PASSWORD
#   docker compose up --build
# Open http://localhost:8000

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragbot}
      POSTGRES_USER: ${POSTGRES_USER:-ragbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ragbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ragbot}
      AUTO_MIGRATE: "false"
      UPLOAD_DIR: /app/data/uploads
      APP_ENV_FILE: ""
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
