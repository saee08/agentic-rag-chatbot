[project]
name = "agentic-rag-backend"
version = "1.0.0"
description = "Multi-user agentic RAG document assistant (FastAPI backend)"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not slow and not postgres'"
markers = [
    "slow: downloads and runs the real embedding model",
    "postgres: runs against an embedded PostgreSQL + pgvector server (pgserver)",
]
filterwarnings = ["ignore::DeprecationWarning:pptx.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "SIM905"]
"alembic/**" = ["E501"]
"app/rag/prompts.py" = ["E501"]  # prompt prose
"app/rag/keyword_search.py" = ["S608", "SIM905"]  # constant SQL fragments only; values are bound

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
